# ============================================================
# Render Deployment Configuration
# Smart Drug Interaction Analysis Platform
# ============================================================

services:
  # ─── FastAPI Backend ──────────────────────────────────────
  - type: web
    name: drug-interaction-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.1
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: drug-interaction-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: drug-interaction-redis
          type: redis
          property: connectionString
      - key: CHROMA_DB_PATH
        value: /tmp/chroma_data
      - key: JSON_LOGS
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: ""    # Kafka not available on Render free tier
    healthCheckPath: /api/v1/health

  # ─── React Frontend ───────────────────────────────────────
  - type: web
    name: drug-interaction-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://drug-interaction-backend.onrender.com/api/$1
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://drug-interaction-backend.onrender.com/api/v1

databases:
  # ─── PostgreSQL ───────────────────────────────────────────
  - name: drug-interaction-db
    databaseName: drugdb
    plan: free

  # ─── Redis ───────────────────────────────────────────────
  - name: drug-interaction-redis
    plan: free
    type: redis
