global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    monitor: 'drug-interaction-platform'

rule_files: []

scrape_configs:

  # FastAPI Backend Metrics
  - job_name: 'fastapi-backend'
    metrics_path: '/metrics'
    scrape_interval: 10s

    static_configs:
      - targets:
          - backend:8000

  # Prometheus Self Metrics
  - job_name: 'prometheus'

    static_configs:
      - targets:
          - prometheus:9090